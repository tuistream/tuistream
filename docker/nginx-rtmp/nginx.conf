worker_processes auto;
rtmp_auto_push on;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4000;

        # Application to ingest live RTMP streams (e.g. from OBS Studio)
        application live {
            live on;
            record off;

            # Enable HLS generation
            hls on;
            hls_path /var/hls;
            hls_fragment 3;
            hls_playlist_length 60;

            # Disable security publish checks for easy local testing
            allow publish all;
            allow play all;
        }
    }
}

http {
    sendfile off;
    tcp_nopush on;
    default_type application/octet-stream;

    server {
        listen 80;

        # Serve HLS playlist and fragments
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # RTMP statistics endpoint in XML format
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin *;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        # Basic healthcheck endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
