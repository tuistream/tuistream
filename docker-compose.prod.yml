#===============================================================================
# TuiStream — Docker Compose Producción
#===============================================================================
# Servicios incluidos:
#   app (PHP 8.4 + Laravel Octane)  |  postgres (PostgreSQL 17)
#   redis (Redis 7)                 |  nginx-rtmp (RTMP + HLS)
#   icecast (Icecast 2 KH)          |  shoutcast (SHOUTcast 2)
#   liquidsoap (AutoDJ)             |  nginx-proxy (SSL + Reverse Proxy)
#   certbot (Let's Encrypt Auto)    |
#===============================================================================

services:
  # ── Aplicacion Principal PHP + Laravel ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuistream_app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - station_media:/var/www/storage/app/public/stations
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=tuistream
      - DB_USERNAME=tuistream
      - DB_PASSWORD=${DB_PASS:-secret_password_123}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASS:-null}
      - BROADCAST_DRIVER=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    depends_on:
      - postgres
      - redis
    networks:
      - tuistream_net

  # ── Base de Datos PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: tuistream_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuistream
      POSTGRES_USER: tuistream
      POSTGRES_PASSWORD: ${DB_PASS:-secret_password_123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tuistream_net

  # ── Cache Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tuistream_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-null} --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - tuistream_net

  # ── Nginx-RTMP para Video Streaming + HLS ────────────────────────────────
  nginx-rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: tuistream_nginx_rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"
    volumes:
      - ./docker/nginx-rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
      - hlsdata:/var/hls
    networks:
      - tuistream_net

  # ── Icecast 2 KH para Audio Streaming ────────────────────────────────────
  icecast:
    image: libretime/icecast:2.5.0
    container_name: tuistream_icecast
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=${STREAM_PASS:-hackme}
      - ICECAST_ADMIN_PASSWORD=${STREAM_PASS:-hackme}
    volumes:
      - ./docker/icecast/icecast.xml:/etc/icecast.xml:ro
    networks:
      - tuistream_net

  # ── SHOUTcast 2 para Audio Streaming ─────────────────────────────────────
  shoutcast:
    image: mabene/shoutcast:latest
    container_name: tuistream_shoutcast
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - ./docker/shoutcast/sc_serv.conf:/opt/shoutcast/sc_serv.conf:ro
    networks:
      - tuistream_net

  # ── Liquidsoap AutoDJ ─────────────────────────────────────────────────────
  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: tuistream_liquidsoap
    restart: unless-stopped
    volumes:
      - ./docker/liquidsoap/script.liq:/etc/liquidsoap/script.liq:ro
      - media:/usr/share/liquidsoap/media
    depends_on:
      - icecast
    networks:
      - tuistream_net

  # ── Nginx Reverse Proxy + SSL ─────────────────────────────────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: tuistream_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certs/www:/var/www/certbot
      - ./docker/certs/letsencrypt:/etc/letsencrypt
      - hlsdata:/var/hls:ro
    depends_on:
      - app
    networks:
      - tuistream_net

  # ── Certbot para SSL automático (Let's Encrypt) ──────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: tuistream_certbot
    restart: "no"
    volumes:
      - ./docker/certs/www:/var/www/certbot
      - ./docker/certs/letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DOMAIN="$${DOMAIN:-localhost}"
        EMAIL="$${EMAIL:-admin@localhost}"
        echo "Esperando a Nginx..."
        sleep 15
        echo "Solicitando certificado SSL para $DOMAIN..."
        certbot certonly --webroot -w /var/www/certbot \
          -d "$DOMAIN" \
          --email "$EMAIL" \
          --agree-tos \
          --non-interactive || echo "Certificado no obtenido aún. Se reintentará en 1 hora."
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 43200
        done
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    networks:
      - tuistream_net

networks:
  tuistream_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  hlsdata:
  media:
  station_media:
